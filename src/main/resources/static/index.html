<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Management System</title>

<link rel="stylesheet" href="/css/style.css">

</head>

<body>

	<div class="container">

		<div class="login-card">

			<div class="logo">💰</div>

			<h1>Loan Management System</h1>

			<p class="subtitle">Securely manage your loans</p>

			<div id="message"></div>


			<!-- ================= LOGIN SECTION ================= -->

			<div id="loginSection">

				<form id="loginForm">

					<div class="form-group">

						<label>Email</label> <input type="email" id="email"
							placeholder="Enter your email" required>

					</div>


					<div class="form-group">

						<label>Password</label> <input type="password" id="password"
							placeholder="Enter your password" required>

					</div>


					<button type="submit">Login</button>

				</form>
				<div style="text-align: center; margin-top: 15px;">
					<a href="/forgot-password.html"> Forgot Password? </a>
				</div>


				<p class="register-text">

					Don't have an account? <a href="#" id="showRegister"> Register
					</a>

				</p>

			</div>


			<!-- ================= REGISTER SECTION ================= -->

			<div id="registerSection" style="display: none;">

				<h2>Create Account</h2>


				<form id="registerForm">


					<div class="form-group">

						<label>Name</label> <input type="text" id="registerName"
							placeholder="Enter your name" required>

					</div>


					<div class="form-group">

						<label>Email</label> <input type="email" id="registerEmail"
							placeholder="Enter your email" required>

					</div>


					<div class="form-group">

						<label>Phone</label> <input type="tel" id="registerPhone"
							placeholder="Enter 10-digit mobile number" maxlength="10"
							required>

					</div>


					<div class="form-group">

						<label>Password</label> <input type="password"
							id="registerPassword" placeholder="Enter password" required>

					</div>


					<button type="submit">Register</button>

				</form>


				<p class="register-text">

					Already have an account? <a href="#" id="showLogin"> Login </a>

				</p>

			</div>

		</div>

	</div>


	<script src="/js/app.js"></script>

</body>

</html>
