<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Loan Management System</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h2>🔑 Forgot Password</h2>

            <p>
                Enter your registered email address.
                We will send you a password reset link.
            </p>

            <form id="forgotPasswordForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-btn"
                    id="submitButton">

                    Send Reset Link

                </button>

            </form>

            <p id="message"></p>

            <p>
                <a href="/">
                    ← Back to Login
                </a>
            </p>

        </div>

    </div>

    <script>

        const form =
            document.getElementById("forgotPasswordForm");

        const message =
            document.getElementById("message");

        const submitButton =
            document.getElementById("submitButton");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email")
                        .value.trim();

                if (!email) {

                    message.textContent =
                        "Please enter your email address.";

                    message.className =
                        "error-message";

                    return;
                }

                submitButton.disabled = true;

                submitButton.textContent =
                    "Sending...";

                message.textContent = "";


                try {

                    const response =
                        await fetch(
                            "/api/users/forgot-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email
                                })
                            }
                        );

                    const result =
                        await response.text();


                    if (!response.ok) {

                        message.textContent =
                            result ||
                            "Unable to process request.";

                        message.className =
                            "error-message";

                        return;
                    }


                    message.textContent =
                        result;

                    message.className =
                        "success-message";


                    form.reset();

                } catch (error) {

                    console.error(
                        "Forgot password error:",
                        error
                    );

                    message.textContent =
                        "Unable to connect to the server. Please try again.";

                    message.className =
                        "error-message";

                } finally {

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Send Reset Link";
                }

            }
        );

    </script>

</body>

</html>
